apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: asko
  labels: { app: web, component: frontend }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web, component: frontend } }
    spec:
      containers:
      - name: web
        image: asko/web:latest
        ports:
        - { containerPort: 3000, name: http }
        env:
        - { name: NODE_ENV, value: "production" }
        - { name: PORT, value: "3000" }
        - { name: HOSTNAME, value: "0.0.0.0" }
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits: { memory: "512Mi", cpu: "500m" }
        livenessProbe:
          httpGet: { path: /, port: 3000 }
          initialDelaySeconds: 15
        readinessProbe:
          httpGet: { path: /, port: 3000 }
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: asko
spec:
  selector: { app: web }
  ports:
  - { port: 3000, targetPort: 3000, name: http }
