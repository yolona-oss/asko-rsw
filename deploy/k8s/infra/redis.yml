apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: asko
  labels: { app: redis, component: infra }
spec:
  serviceName: redis
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis, component: infra } }
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - { containerPort: 6379, name: redis }
        volumeMounts:
        - { name: data, mountPath: /data }
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: [ReadWriteOnce]
      resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: asko
spec:
  selector: { app: redis }
  ports:
  - { port: 6379, targetPort: 6379, name: redis }
