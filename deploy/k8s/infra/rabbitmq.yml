apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: asko
  labels: { app: rabbitmq, component: infra }
spec:
  serviceName: rabbitmq
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq, component: infra } }
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management-alpine
        ports:
        - { containerPort: 5672, name: amqp }
        - { containerPort: 15672, name: management }
        - { containerPort: 15692, name: prometheus }
        env:
        - { name: RABBITMQ_DEFAULT_USER, value: "asko" }
        - { name: RABBITMQ_DEFAULT_PASS, valueFrom: { secretKeyRef: { name: asko-secrets, key: RABBITMQ_PASS } } }
        - { name: RABBITMQ_PLUGINS, value: "rabbitmq_management rabbitmq_prometheus" }
        volumeMounts:
        - { name: data, mountPath: /var/lib/rabbitmq }
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: [ReadWriteOnce]
      resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: asko
spec:
  selector: { app: rabbitmq }
  ports:
  - { port: 5672, targetPort: 5672, name: amqp }
  - { port: 15672, targetPort: 15672, name: management }
  - { port: 15692, targetPort: 15692, name: prometheus }
