apiVersion: apps/v1
kind: Deployment
metadata:
  name: repair-gateway
  namespace: asko
  labels:
    app: repair-gateway
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: repair-gateway
  template:
    metadata:
      labels:
        app: repair-gateway
        component: gateway
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: repair-gateway
                topologyKey: kubernetes.io/hostname
      containers:
        - name: repair-gateway
          image: asko/repair-gateway:latest
          ports:
            - containerPort: 4002
              name: http
            - containerPort: 9121
              name: metrics
          envFrom:
            - configMapRef:
                name: asko-config
            - secretRef:
                name: asko-secrets
          env:
            - name: PORT
              value: "4002"
            - name: METRICS_PORT
              value: "9121"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: repair-gateway
  namespace: asko
  labels:
    app: repair-gateway
    component: gateway
spec:
  type: ClusterIP
  selector:
    app: repair-gateway
  ports:
    - port: 4002
      targetPort: 4002
      name: http
    - port: 9121
      targetPort: 9121
      name: metrics
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: repair-gateway
  namespace: asko
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: repair-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
