apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-gateway
  namespace: asko
  labels:
    app: content-gateway
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: content-gateway
  template:
    metadata:
      labels:
        app: content-gateway
        component: gateway
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: content-gateway
                topologyKey: kubernetes.io/hostname
      containers:
        - name: content-gateway
          image: asko/content-gateway:latest
          ports:
            - containerPort: 4005
              name: http
            - containerPort: 9124
              name: metrics
          envFrom:
            - configMapRef:
                name: asko-config
            - secretRef:
                name: asko-secrets
          env:
            - name: PORT
              value: "4005"
            - name: METRICS_PORT
              value: "9124"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: content-gateway
  namespace: asko
  labels:
    app: content-gateway
    component: gateway
spec:
  type: ClusterIP
  selector:
    app: content-gateway
  ports:
    - port: 4005
      targetPort: 4005
      name: http
    - port: 9124
      targetPort: 9124
      name: metrics
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: content-gateway
  namespace: asko
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: content-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
