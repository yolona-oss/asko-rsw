apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-gateway
  namespace: asko
  labels:
    app: auth-gateway
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-gateway
  template:
    metadata:
      labels:
        app: auth-gateway
        component: gateway
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: auth-gateway
                topologyKey: kubernetes.io/hostname
      containers:
        - name: auth-gateway
          image: asko/auth-gateway:latest
          ports:
            - containerPort: 4001
              name: http
            - containerPort: 9120
              name: metrics
          envFrom:
            - configMapRef:
                name: asko-config
            - secretRef:
                name: asko-secrets
          env:
            - name: PORT
              value: "4001"
            - name: METRICS_PORT
              value: "9120"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-gateway
  namespace: asko
  labels:
    app: auth-gateway
    component: gateway
spec:
  type: ClusterIP
  selector:
    app: auth-gateway
  ports:
    - port: 4001
      targetPort: 4001
      name: http
    - port: 9120
      targetPort: 9120
      name: metrics
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-gateway
  namespace: asko
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
