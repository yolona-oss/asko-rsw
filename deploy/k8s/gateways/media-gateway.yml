apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-gateway
  namespace: asko
  labels:
    app: media-gateway
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: media-gateway
  template:
    metadata:
      labels:
        app: media-gateway
        component: gateway
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: media-gateway
                topologyKey: kubernetes.io/hostname
      containers:
        - name: media-gateway
          image: asko/media-gateway:latest
          ports:
            - containerPort: 4003
              name: http
            - containerPort: 9122
              name: metrics
          envFrom:
            - configMapRef:
                name: asko-config
            - secretRef:
                name: asko-secrets
          env:
            - name: PORT
              value: "4003"
            - name: METRICS_PORT
              value: "9122"
          volumeMounts:
            - name: images-data
              mountPath: /app/apps/media-gateway/images
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: images-data
          persistentVolumeClaim:
            claimName: images-data
---
apiVersion: v1
kind: Service
metadata:
  name: media-gateway
  namespace: asko
  labels:
    app: media-gateway
    component: gateway
spec:
  type: ClusterIP
  selector:
    app: media-gateway
  ports:
    - port: 4003
      targetPort: 4003
      name: http
    - port: 9122
      targetPort: 9122
      name: metrics
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: media-gateway
  namespace: asko
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: media-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
