apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: asko
  labels:
    app: chat-service
    component: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
        component: service
    spec:
      containers:
        - name: chat-service
          image: asko/chat-service:latest
          ports:
            - containerPort: 5005
              name: grpc
            - containerPort: 9105
              name: metrics
          envFrom:
            - configMapRef:
                name: asko-config
            - secretRef:
                name: asko-secrets
          env:
            - name: GRPC_PORT
              value: "5005"
            - name: METRICS_PORT
              value: "9105"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: asko
  labels:
    app: chat-service
    component: service
spec:
  type: ClusterIP
  selector:
    app: chat-service
  ports:
    - port: 5005
      targetPort: 5005
      name: grpc
    - port: 9105
      targetPort: 9105
      name: metrics
