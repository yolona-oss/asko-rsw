apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: asko
  labels:
    app: notification-service
    component: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        component: service
    spec:
      containers:
        - name: notification-service
          image: asko/notification-service:latest
          ports:
            - containerPort: 5004
              name: grpc
            - containerPort: 9104
              name: metrics
          envFrom:
            - configMapRef:
                name: asko-config
            - secretRef:
                name: asko-secrets
          env:
            - name: GRPC_PORT
              value: "5004"
            - name: METRICS_PORT
              value: "9104"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: asko
  labels:
    app: notification-service
    component: service
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - port: 5004
      targetPort: 5004
      name: grpc
    - port: 9104
      targetPort: 9104
      name: metrics
