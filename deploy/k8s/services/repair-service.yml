apiVersion: apps/v1
kind: Deployment
metadata:
  name: repair-service
  namespace: asko
  labels:
    app: repair-service
    component: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: repair-service
  template:
    metadata:
      labels:
        app: repair-service
        component: service
    spec:
      containers:
        - name: repair-service
          image: asko/repair-service:latest
          ports:
            - containerPort: 5003
              name: grpc
            - containerPort: 9103
              name: metrics
          envFrom:
            - configMapRef:
                name: asko-config
            - secretRef:
                name: asko-secrets
          env:
            - name: GRPC_PORT
              value: "5003"
            - name: METRICS_PORT
              value: "9103"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: repair-service
  namespace: asko
  labels:
    app: repair-service
    component: service
spec:
  type: ClusterIP
  selector:
    app: repair-service
  ports:
    - port: 5003
      targetPort: 5003
      name: grpc
    - port: 9103
      targetPort: 9103
      name: metrics
