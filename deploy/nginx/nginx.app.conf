# ASKO — Host nginx config (SSL termination + gateway routing)
# Installed on VPS at /etc/nginx/sites-available/asko
# This replaces the Docker nginx container for single-server VPS deployment.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream auth_gateway      { server 127.0.0.1:4001; }
upstream repair_gateway    { server 127.0.0.1:4002; }
upstream media_gateway     { server 127.0.0.1:4003; }
upstream realtime_gateway  { server 127.0.0.1:4004; }
upstream content_gateway   { server 127.0.0.1:4005; }
upstream web_frontend      { server 127.0.0.1:3000; }
upstream grafana            { server 127.0.0.1:3001; }

# ── HTTPS ──────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name askoservis.ru www.askoservis.ru;

    ssl_certificate /etc/letsencrypt/live/askoservis.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/askoservis.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    # Shared proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Add trailing slash to bare API paths (preserves HTTP method unlike 301)
    rewrite ^(/api/[a-z][a-z0-9-]*)$ $1/ last;

    # ── Auth Gateway (:4001) ──
    location /api/auth/   { proxy_pass http://auth_gateway/auth/; }
    location /api/invite/ { proxy_pass http://auth_gateway/invite/; }

    # ── Repair Gateway (:4002) ──
    location /api/repair-requests/   { proxy_pass http://repair_gateway/repair-requests/; }
    location /api/devices/           { proxy_pass http://repair_gateway/devices/; }
    location /api/user-devices/      { proxy_pass http://repair_gateway/user-devices/; }
    location /api/device-categories/ { proxy_pass http://repair_gateway/device-categories/; }
    location /api/certificates/      { proxy_pass http://repair_gateway/certificates/; }
    location /api/repairers/         { proxy_pass http://repair_gateway/repairers/; }
    location /api/dealers/           { proxy_pass http://repair_gateway/dealers/; }
    location /api/reviews/           { proxy_pass http://repair_gateway/reviews/; }
    location /api/schedule/          { proxy_pass http://repair_gateway/schedule/; }
    location /api/address/           { proxy_pass http://repair_gateway/address/; }
    location /api/payment/           { proxy_pass http://repair_gateway/payment/; }

    # ── Media Gateway (:4003) ──
    location /api/file-upload/ { proxy_pass http://media_gateway/file-upload/; }
    location /api/files/       { proxy_pass http://media_gateway/files/; }

    # Static images/videos — aggressive caching (UUID-named, immutable)
    location /api/images/ {
        proxy_pass http://media_gateway/images/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /api/videos/ {
        proxy_pass http://media_gateway/videos/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Realtime Gateway (:4004) — WebSocket ──
    location /api/chat/ {
        proxy_pass http://realtime_gateway/chat/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }
    location /api/notifications/ {
        proxy_pass http://realtime_gateway/notifications/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }
    location /api/socket.io/ {
        proxy_pass http://realtime_gateway/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── Content Gateway (:4005) ──
    location /api/articles/ { proxy_pass http://content_gateway/articles/; }
    location /api/users/    { proxy_pass http://content_gateway/users/; }

    # ── Health check (any gateway) ──
    location /api/health { proxy_pass http://auth_gateway/health; }

    # ── Grafana ──
    location /grafana/ {
        proxy_pass http://grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ── Certbot ──
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Frontend ──
    location / {
        proxy_pass http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ── HTTP → HTTPS redirect ──────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name askoservis.ru www.askoservis.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://$host$request_uri;
}
