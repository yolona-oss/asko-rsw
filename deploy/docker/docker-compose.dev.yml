# ASKO — Development Docker Compose
#
# Usage:
#   docker compose -f docker-compose.dev.yml --profile data up -d                      # RabbitMQ + Redis
#   docker compose -f docker-compose.dev.yml --profile data --profile monitoring up -d  # + Prometheus/Grafana
#
# Services (api, user-service, etc.) are started separately via ./scripts/dev.sh

services:

  # ── Data layer ────────────────────────────────────────

  rabbitmq:
    profiles: ["data"]
    image: rabbitmq:3-management-alpine
    container_name: asko-rabbitmq-dev
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
      - "15692:15692"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-guest}"
      RABBITMQ_PLUGINS: "rabbitmq_management rabbitmq_prometheus"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    profiles: ["data"]
    image: redis:7-alpine
    container_name: asko-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Monitoring ────────────────────────────────────────

  redis-exporter:
    profiles: ["monitoring"]
    image: oliver006/redis_exporter:latest
    container_name: asko-redis-exporter-dev
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_ADDR: "${REDIS_ADDR:-redis://localhost:6379}"
    command: ["--web.listen-address=:9121"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9121/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    container_name: asko-prometheus-dev
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.listen-address=:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    container_name: asko-grafana-dev
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-admin}"
      GF_SERVER_HTTP_PORT: "${GF_SERVER_HTTP_PORT:-3001}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${GF_SERVER_HTTP_PORT:-3001}/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
