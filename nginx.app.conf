map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name 109.69.63.136;

    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name 109.69.63.136;

    ssl_certificate     /etc/nginx/ssl/vikunja.pem;
    ssl_certificate_key /etc/nginx/ssl/vikunja.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100M;

    # Static images — aggressive caching (UUID-named, immutable)
    location /api/images/ {
        proxy_pass http://127.0.0.1:4000/images/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Static videos — aggressive caching (UUID-named, immutable)
    location /api/videos/ {
        proxy_pass http://127.0.0.1:4000/videos/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # NestJS API
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /ws/socket.io/ {
        proxy_pass http://127.0.0.1:4001/ws/socket.io/;
    
        proxy_http_version 1.1;
    
        proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
	proxy_set_header Connection $connection_upgrade;
    
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    
        proxy_buffering off;
    }

    # Existing app frontend / other paths
    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
	proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
