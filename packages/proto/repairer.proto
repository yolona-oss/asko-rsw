syntax = "proto3";

package repairer;

service RepairerService {
    // Repairer CRUD
    rpc CreateRepairer(CreateRepairerRequest) returns (RepairerResponse);
    rpc UpdateRepairer(UpdateRepairerRequest) returns (RepairerResponse);
    rpc UpdateLocation(UpdateLocationRequest) returns (RepairerResponse);
    rpc GetMyProfile(GetByUserIdRequest) returns (RepairerResponse);
    rpc FindAllRepairers(FindAllRepairersRequest) returns (PaginatedRepairersResponse);
    rpc FindRepairerById(FindByIdRequest) returns (RepairerResponse);
    rpc FindByUserId(GetByUserIdRequest) returns (RepairerResponse);
    rpc FindActiveInCity(FindInCityRequest) returns (RepairerListResponse);
    rpc IncrementCompleted(FindByIdRequest) returns (EmptyRepairerResponse);
    rpc UpdateLastLocation(UpdateLastLocationRequest) returns (EmptyRepairerResponse);

    // Reviews
    rpc CreateReview(CreateReviewRequest) returns (ReviewResponse);
    rpc FindReviewsByRepairer(FindReviewsByRepairerRequest) returns (PaginatedReviewsResponse);
    rpc GetRepairerRating(FindByIdRequest) returns (RatingResponse);
    rpc FindReviewsByUser(GetByUserIdRequest) returns (ReviewListResponse);
    rpc FindUserReview(FindUserReviewRequest) returns (ReviewResponse);
}

// ─── Records ────────────────────────────────────────────────────────────

message RepairerRecord {
    string id = 1;
    string userId = 2;
    repeated string specializations = 3;
    string city = 4;
    bool isActive = 5;
    int32 completedRepairs = 6;
    double latitude = 7;
    double longitude = 8;
    string lastLocationUpdate = 9;
    string createdAt = 10;
    string updatedAt = 11;
}

message ReviewRecord {
    string id = 1;
    string repairRequestId = 2;
    string userId = 3;
    string repairerId = 4;
    int32 rating = 5;
    string comment = 6;
    string createdAt = 7;
}

// ─── Requests ───────────────────────────────────────────────────────────

message CreateRepairerRequest {
    string userId = 1;
    string city = 2;
    repeated string specializations = 3;
}

message UpdateRepairerRequest {
    string id = 1;
    string city = 2;
    repeated string specializations = 3;
    bool isActive = 4;
}

message UpdateLocationRequest {
    string userId = 1;
    double latitude = 2;
    double longitude = 3;
}

message UpdateLastLocationRequest {
    string id = 1;
    double latitude = 2;
    double longitude = 3;
}

message GetByUserIdRequest {
    string userId = 1;
}

message FindByIdRequest {
    string id = 1;
}

message FindAllRepairersRequest {
    int32 offset = 1;
    int32 limit = 2;
    string search = 3;
}

message FindInCityRequest {
    string city = 1;
}

message CreateReviewRequest {
    string repairRequestId = 1;
    string userId = 2;
    string repairerId = 3;
    int32 rating = 4;
    string comment = 5;
}

message FindReviewsByRepairerRequest {
    string repairerId = 1;
    int32 offset = 2;
    int32 limit = 3;
}

message FindUserReviewRequest {
    string userId = 1;
    string reviewId = 2;
}

// ─── Responses ──────────────────────────────────────────────────────────

message EmptyRepairerResponse {}

message RepairerResponse {
    RepairerRecord repairer = 1;
}

message RepairerListResponse {
    repeated RepairerRecord repairers = 1;
}

message PaginatedRepairersResponse {
    repeated RepairerRecord data = 1;
    int32 overallCount = 2;
    int32 offset = 3;
    int32 limit = 4;
}

message ReviewResponse {
    ReviewRecord review = 1;
}

message ReviewListResponse {
    repeated ReviewRecord reviews = 1;
}

message PaginatedReviewsResponse {
    repeated ReviewRecord data = 1;
    int32 overallCount = 2;
    int32 offset = 3;
    int32 limit = 4;
}

message RatingResponse {
    double average = 1;
    int32 count = 2;
}
