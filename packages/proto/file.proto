syntax = "proto3";

package file;

service FileService {
    // Upload
    rpc UploadFile(stream UploadChunk) returns (UploadFileResponse);

    // URL operations
    rpc CreateFromUrl(CreateFromUrlRequest) returns (ImageResponse);

    // Image management
    rpc Remove(ImageIdRequest) returns (EmptyResponse);
    rpc UnattachImage(ImageIdRequest) returns (EmptyResponse);
    rpc AttachImage(AttachImageRequest) returns (ImageResponse);
    rpc FindAttachedImages(FindAttachedRequest) returns (ImageListResponse);
    rpc CountAttached(CountAttachedRequest) returns (CountResponse);
    rpc DeleteByOwner(FindAttachedRequest) returns (CountResponse);
    rpc ReorderImages(ReorderImagesRequest) returns (EmptyResponse);
    rpc ReorderByIds(ReorderByIdsRequest) returns (ImageListResponse);

    // Video management
    rpc RemoveVideo(VideoIdRequest) returns (EmptyResponse);
    rpc FindAttachedVideos(FindAttachedRequest) returns (VideoListResponse);
    rpc AttachVideo(AttachVideoRequest) returns (VideoResponse);
    rpc UnattachVideo(VideoIdRequest) returns (EmptyResponse);

    // Document management
    rpc GetDocument(DocumentIdRequest) returns (DocumentResponse);
    rpc GetDocumentsByOwner(FindAttachedRequest) returns (DocumentListResponse);
    rpc DeleteDocument(DocumentIdRequest) returns (EmptyResponse);

    // Access control
    rpc GetFileAccess(GetFileAccessRequest) returns (FileAccessResponse);
}

// ─── Common ────────────────────────────────────────────────────────────

// ─── Streaming upload payload ──────────────────────────────────────────

// Sent once as the first chunk of every streaming upload RPC.
// Carries all the metadata the server needs before file bytes arrive.
message UploadStart {
    string originalname   = 1;
    string mimetype       = 2;
    string ownerId        = 3;
    string visibility     = 4;  // documents only; ignored otherwise
    string creatorId      = 5;  // documents only
    string conversationId = 6;  // documents only
    string alt            = 7;  // generic image upload only; ignored otherwise
    string ownerType      = 8;  // e.g. "user", "device", "repair_request"
    bool   replaceExisting = 9; // delete existing files for (ownerType, ownerId) before upload
}

// Client-streaming payload for all file upload RPCs.
// First message carries `start`; subsequent messages carry `data`.
message UploadChunk {
    oneof payload {
        UploadStart start = 1;
        bytes       data  = 2;
    }
}

// ─── Requests ──────────────────────────────────────────────────────────

message CreateFromUrlRequest {
    string url = 1;
    string ownerType = 2;
    string ownerId = 3;
    int32 order = 4;
}

message ImageIdRequest {
    string id = 1;
}

message AttachImageRequest {
    string imageId = 1;
    string ownerType = 2;
    string ownerId = 3;
}

message FindAttachedRequest {
    string ownerType = 1;
    string ownerId = 2;
}

message CountAttachedRequest {
    string ownerId = 1;
    string ownerType = 2;
}

message ReorderImagesRequest {
    string ownerType = 1;
    string ownerId = 2;
    repeated ReorderItem schema = 3;
}

message ReorderItem {
    string id = 1;
    int32 order = 2;
}

message ReorderByIdsRequest {
    string ownerType = 1;
    string ownerId = 2;
    repeated string imageIds = 3;
}

// ─── Responses ─────────────────────────────────────────────────────────

message EmptyResponse {}

message ImageRecord {
    string id = 1;
    string imageJson = 2;
    string alt = 3;
    int32 order = 4;
    string ownerType = 5;
    string ownerId = 6;
    string createdAt = 8;
    string updatedAt = 9;
    string visibility = 10;
    string creatorId = 11;
    string conversationId = 12;
}

message ImageResponse {
    ImageRecord image = 1;
}

message ImageListResponse {
    repeated ImageRecord images = 1;
}

message CountResponse {
    int32 count = 1;
}

// ─── Video ────────────────────────────────────────────────────────────

message VideoIdRequest {
    string id = 1;
}

message AttachVideoRequest {
    string videoId = 1;
    string ownerType = 2;
    string ownerId = 3;
}

message VideoRecord {
    string id = 1;
    string videoJson = 2;
    int32 order = 3;
    string ownerType = 4;
    string ownerId = 5;
    string createdAt = 6;
    string updatedAt = 7;
    string visibility = 8;
    string creatorId = 9;
    string conversationId = 10;
}

message VideoResponse {
    VideoRecord video = 1;
}

message VideoListResponse {
    repeated VideoRecord videos = 1;
}

// ─── Access control ──────────────────────────────────────────────────

message GetFileAccessRequest {
    string id = 1;
    string type = 2;
}

message FileAccessResponse {
    string id = 1;
    string visibility = 2;
    string creatorId = 3;
    string conversationId = 4;
    string storageUrl = 5;
    string publicId = 6;
}

// ─── Documents ────────────────────────────────────────────────────────


message DocumentIdRequest {
    string id = 1;
}

message DocumentRecord {
    string id = 1;
    string filename = 2;
    string mimeType = 3;
    int64 sizeBytes = 4;
    string ownerType = 5;
    string ownerId = 6;
    string storageUrl = 7;
    string publicId = 8;
    string createdAt = 9;
}

message DocumentResponse {
    DocumentRecord document = 1;
}

message DocumentListResponse {
    repeated DocumentRecord documents = 1;
}

// ─── Unified upload ──────────────────────────────────────────────────

message UploadFileResponse {
    string fileType = 1;
    ImageRecord image = 2;
    VideoRecord video = 3;
    DocumentRecord document = 4;
}
