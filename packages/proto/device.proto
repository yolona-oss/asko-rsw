syntax = "proto3";

package device;

service DeviceService {
    // Device catalog (admin)
    rpc CreateDevice(CreateDeviceRequest) returns (DeviceResponse);
    rpc UpdateDevice(UpdateDeviceRequest) returns (DeviceResponse);
    rpc DeleteDevice(DeleteDeviceRequest) returns (EmptyResponse);
    rpc DeleteAllDevices(EmptyRequest) returns (DeleteAllResponse);
    rpc ImportDevices(ImportDevicesRequest) returns (ImportDevicesResponse);

    // Device catalog (public)
    rpc FindAllDevices(FindAllDevicesRequest) returns (PaginatedDevicesResponse);
    rpc FindDeviceBySlug(FindBySlugRequest) returns (DeviceResponse);
    rpc FindDeviceById(FindByIdRequest) returns (DeviceResponse);
    rpc GetDevicePrice(FindByIdRequest) returns (DevicePriceResponse);

    // User devices
    rpc RegisterUserDevice(RegisterUserDeviceRequest) returns (UserDeviceResponse);
    rpc GetUserDevices(GetUserDevicesRequest) returns (UserDeviceListResponse);
    rpc GetUserDevice(GetUserDeviceRequest) returns (UserDeviceResponse);
    rpc RemoveUserDevice(RemoveUserDeviceRequest) returns (EmptyResponse);
    rpc FindUserDeviceById(FindByIdRequest) returns (UserDeviceResponse);

    // Address
    rpc CreateAddress(CreateAddressRequest) returns (AddressResponse);
    rpc FindAddressById(FindByIdRequest) returns (AddressResponse);
    rpc FindAllAddresses(EmptyRequest) returns (AddressListResponse);
}

// ─── Requests ───────────────────────────────────────────────────────────

message EmptyRequest {}

message CreateDeviceRequest {
    string name = 1;
    string type = 2;
    string model = 3;
    string brand = 4;
    string description = 5;
    string specifications = 6;
    string features = 7;
}

message UpdateDeviceRequest {
    string id = 1;
    string name = 2;
    string type = 3;
    string model = 4;
    string brand = 5;
    double price = 6;
    string description = 7;
    string specifications = 8;
    string features = 9;
    string slug = 10;
    bool isFeatured = 11;
}

message DeleteDeviceRequest {
    string id = 1;
}

message ImportDevicesRequest {
    string productsJson = 1;
}

message FindAllDevicesRequest {
    int32 offset = 1;
    int32 limit = 2;
    string search = 3;
}

message FindBySlugRequest {
    string slug = 1;
}

message FindByIdRequest {
    string id = 1;
}

message RegisterUserDeviceRequest {
    string userId = 1;
    string deviceId = 2;
    string serialNumber = 3;
    string addressId = 4;
    string purchaseDate = 5;
    string warrantyUntil = 6;
    string notes = 7;
}

message GetUserDevicesRequest {
    string userId = 1;
}

message GetUserDeviceRequest {
    string userId = 1;
    string id = 2;
}

message RemoveUserDeviceRequest {
    string userId = 1;
    string id = 2;
}

message CreateAddressRequest {
    string country = 1;
    string city = 2;
    string street = 3;
    int32 house = 4;
    int32 building = 5;
    int32 floor = 6;
    int32 room = 7;
    string postalCode = 8;
}

// ─── Responses ──────────────────────────────────────────────────────────

message EmptyResponse {}

message DeleteAllResponse {
    int32 deletedCount = 1;
}

message ImportDevicesResponse {
    int32 importedCount = 1;
}

message DeviceRecord {
    string id = 1;
    string name = 2;
    string type = 3;
    string model = 4;
    string brand = 5;
    double price = 6;
    string description = 7;
    string specifications = 8;
    string features = 9;
    string slug = 10;
    bool isFeatured = 11;
    string createdAt = 12;
    string updatedAt = 13;
}

message DeviceResponse {
    DeviceRecord device = 1;
}

message DevicePriceResponse {
    double price = 1;
}

message PaginatedDevicesResponse {
    repeated DeviceRecord data = 1;
    int32 overallCount = 2;
    int32 offset = 3;
    int32 limit = 4;
}

message AddressRecord {
    string id = 1;
    string country = 2;
    string city = 3;
    string street = 4;
    int32 house = 5;
    int32 building = 6;
    int32 floor = 7;
    int32 room = 8;
    string postalCode = 9;
}

message AddressResponse {
    AddressRecord address = 1;
}

message AddressListResponse {
    repeated AddressRecord addresses = 1;
}

message UserDeviceRecord {
    string id = 1;
    string userId = 2;
    string deviceId = 3;
    string serialNumber = 4;
    string addressId = 5;
    string purchaseDate = 6;
    string warrantyUntil = 7;
    string notes = 8;
    string createdAt = 9;
    DeviceRecord device = 10;
    AddressRecord address = 11;
}

message UserDeviceResponse {
    UserDeviceRecord userDevice = 1;
}

message UserDeviceListResponse {
    repeated UserDeviceRecord userDevices = 1;
}
