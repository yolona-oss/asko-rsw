syntax = "proto3";

package user;

// ─── Auth ────────────────────────────────────────────────────────────────────

message LoginRequest {
    string email = 1;
    string password = 2;
    string phone = 3;
    string google_id = 4;
    string device_info = 5;
    string ip_address = 6;
    string trusted_device_token = 7;
}

message LoginResponse {
    string status = 1;
    string access_token = 2;
    string refresh_token = 3;
    AuthUser user = 4;
    string mfa_token = 5;
    string mfa_method = 6;
}

message RegisterRequest {
    string email = 1;
    string password = 2;
    string first_name = 3;
    string last_name = 4;
    string phone = 5;
    string google_id = 6;
    string invite_token = 7;
    string device_info = 8;
    string ip_address = 9;
}

message RegisterResponse {
    string access_token = 1;
    string refresh_token = 2;
    AuthUser user = 3;
    repeated string roles = 4;
}

message AuthSessionResponse {
    string access_token = 1;
    string refresh_token = 2;
    AuthUser user = 3;
}

message AccessTokenResponse {
    string access_token = 1;
}

message ConfirmEmailRequest {
    string token = 1;
}

message ConfirmEmailResponse {
    string message = 1;
}

message ResendConfirmationRequest {
    string email = 1;
}

message ResendConfirmationResponse {
    int32 retry_after = 1;
}

message RequestEmailChangeRequest {
    string id = 1;
    string new_email = 2;
}

message RequestEmailChangeResponse {
    string message = 1;
    int32 retry_after = 2;
}

message ConfirmEmailChangeRequest {
    string token = 1;
}

message ConfirmEmailChangeResponse {
    string message = 1;
}

message RefreshTokenRequest {
    string refresh_token = 1;
}

message LogoutRequest {
    string refresh_token = 1;
}

message DevSwitchRequest {
    string refresh_token = 1;
    string device_info = 2;
    string ip_address = 3;
}

message FindByTokenRequest {
    string access_token = 1;
}

// ─── User CRUD ───────────────────────────────────────────────────────────────

message UserIdRequest {
    string id = 1;
}

message FindByEmailRequest {
    string email = 1;
}

message PaginationRequest {
    int32 offset = 1;
    int32 limit = 2;
}

message UpdateUserRequest {
    string id = 1;
    string name = 2;
    string email = 3;
    string phone = 4;
    string password = 5;
    string address_id = 6;
    string current_password = 7;
    string preferences_json = 8;
}

message ChangePasswordRequest {
    string id = 1;
    string old_password = 2;
    string new_password = 3;
}

message ForgotPasswordRequest {
    string email = 1;
}

message ForgotPasswordResponse {
    string message = 1;
    int32 retry_after = 2;
}

message ResetPasswordRequest {
    string token = 1;
    string new_password = 2;
}

message ResetPasswordResponse {
    string message = 1;
}

message SetUserActiveRequest {
    string id = 1;
    bool is_active = 2;
}

message AddRoleRequest {
    string id = 1;
    string role = 2;
}

message RemoveRoleRequest {
    string id = 1;
    string role = 2;
}

// ─── Invite ──────────────────────────────────────────────────────────────────

message CreateInviteRequest {
    string role = 1;
    int32 ttl = 2;
    string creator_id = 3;
}

message InviteIdRequest {
    string id = 1;
}

message InviteTokenRequest {
    string token = 1;
}

message InviteLinkResponse {
    string id = 1;
    string token = 2;
    string role = 3;
    int32 ttl = 4;
    bool used = 5;
    string expires_at = 6;
    string created_at = 7;
}

message InviteCreatedResponse {
    InviteLinkResponse invite = 1;
    string link = 2;
}

message InviteListResponse {
    repeated InviteLinkResponse invites = 1;
}

// ─── Shared Messages ─────────────────────────────────────────────────────────

message AuthUser {
    string id = 1;
    string first_name = 2;
    string last_name = 3;
    string email = 4;
    string phone = 5;
    string google_id = 6;
    repeated string providers = 7;
    repeated string roles = 8;
    string created_at = 9;
    string updated_at = 10;
    string preferences_json = 11;
    bool is_active = 12;
}

message UserResponse {
    string id = 1;
    string first_name = 2;
    string last_name = 3;
    string email = 4;
    string phone = 5;
    string google_id = 6;
    repeated string providers = 7;
    repeated string roles = 8;
    bool email_verified = 9;
    bool phone_verified = 10;
    string created_at = 11;
    string updated_at = 12;
    string preferences_json = 13;
    bool is_active = 14;
}

message PaginatedUsersResponse {
    repeated UserResponse data = 1;
    int32 overall_count = 2;
    int32 offset = 3;
    int32 limit = 4;
}

message EmptyRequest {}
message EmptyResponse {}

// ─── Chat User Search ───────────────────────────────────────────────────────

message SearchUsersForChatRequest {
    string query = 1;
    string requester_id = 2;
    repeated string requester_roles = 3;
    int32 limit = 4;
}

message ChatUserResult {
    string id = 1;
    string first_name = 2;
    string last_name = 3;
    string email = 4;
}

message SearchUsersForChatResponse {
    repeated ChatUserResult users = 1;
}

// ─── MFA ─────────────────────────────────────────────────────────────────────

message VerifyMfaRequest {
    string mfa_token = 1;
    string code = 2;
    bool trust_device = 3;
    string device_info = 4;
    string ip_address = 5;
}

message VerifyMfaResponse {
    string access_token = 1;
    string refresh_token = 2;
    AuthUser user = 3;
    string trusted_device_token = 4;
}

message ResendMfaOtpRequest {
    string mfa_token = 1;
}

message ResendMfaOtpResponse {
    int32 retry_after = 1;
}

message EnableMfaRequest {
    string user_id = 1;
}

message EnableMfaResponse {
    string message = 1;
    int32 retry_after = 2;
}

message VerifyEnableMfaRequest {
    string user_id = 1;
    string code = 2;
}

message VerifyEnableMfaResponse {
    string message = 1;
}

message InitiateDisableMfaRequest {
    string user_id = 1;
}

message InitiateDisableMfaResponse {
    string message = 1;
    int32 retry_after = 2;
}

message ConfirmDisableMfaRequest {
    string user_id = 1;
    string code = 2;
}

message ConfirmDisableMfaResponse {
    string message = 1;
}

message GetMfaStatusRequest {
    string user_id = 1;
}

message GetMfaStatusResponse {
    bool enabled = 1;
    repeated string methods = 2;
}

// ─── Service ─────────────────────────────────────────────────────────────────

service UserService {
    // Auth
    rpc Login(LoginRequest) returns (LoginResponse);
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc ConfirmEmail(ConfirmEmailRequest) returns (ConfirmEmailResponse);
    rpc ResendConfirmation(ResendConfirmationRequest) returns (ResendConfirmationResponse);
    rpc RefreshAccessToken(RefreshTokenRequest) returns (AccessTokenResponse);
    rpc Logout(LogoutRequest) returns (EmptyResponse);
    rpc DevSwitchAccount(DevSwitchRequest) returns (AuthSessionResponse);
    rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse);
    rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
    rpc RequestEmailChange(RequestEmailChangeRequest) returns (RequestEmailChangeResponse);
    rpc ConfirmEmailChange(ConfirmEmailChangeRequest) returns (ConfirmEmailChangeResponse);

    // MFA
    rpc VerifyMfaOtp(VerifyMfaRequest) returns (VerifyMfaResponse);
    rpc ResendMfaOtp(ResendMfaOtpRequest) returns (ResendMfaOtpResponse);
    rpc EnableMfa(EnableMfaRequest) returns (EnableMfaResponse);
    rpc VerifyEnableMfa(VerifyEnableMfaRequest) returns (VerifyEnableMfaResponse);
    rpc InitiateDisableMfa(InitiateDisableMfaRequest) returns (InitiateDisableMfaResponse);
    rpc ConfirmDisableMfa(ConfirmDisableMfaRequest) returns (ConfirmDisableMfaResponse);
    rpc GetMfaStatus(GetMfaStatusRequest) returns (GetMfaStatusResponse);
    rpc FindUserByAccessToken(FindByTokenRequest) returns (AuthUserResponse);

    // User CRUD
    rpc FindAllUsers(PaginationRequest) returns (PaginatedUsersResponse);
    rpc FindUserById(UserIdRequest) returns (UserResponse);
    rpc DeleteUser(UserIdRequest) returns (EmptyResponse);
    rpc UpdateUser(UpdateUserRequest) returns (UserResponse);
    rpc ChangePassword(ChangePasswordRequest) returns (UserResponse);
    rpc GetProfile(UserIdRequest) returns (UserResponse);
    rpc SetEmailConfirmed(UserIdRequest) returns (EmptyResponse);
    rpc AddRole(AddRoleRequest) returns (EmptyResponse);
    rpc RemoveRole(RemoveRoleRequest) returns (EmptyResponse);
    rpc SetUserActive(SetUserActiveRequest) returns (EmptyResponse);

    // Invite
    rpc CreateInvite(CreateInviteRequest) returns (InviteCreatedResponse);
    rpc FindAllInvites(EmptyRequest) returns (InviteListResponse);
    rpc CheckInvite(InviteTokenRequest) returns (InviteLinkResponse);
    rpc DeleteInvite(InviteIdRequest) returns (EmptyResponse);

    // Search
    rpc FindUserByEmail(FindByEmailRequest) returns (UserResponse);

    // Chat
    rpc SearchUsersForChat(SearchUsersForChatRequest) returns (SearchUsersForChatResponse);
}

message AuthUserResponse {
    AuthUser user = 1;
}
