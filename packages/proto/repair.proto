    string serialNumber = 7;
}

message CertSelfCreateRequest {
    string userId = 1;
    string userDeviceId = 2;
    string expiresAt = 3;
    string description = 4;
}

message CertMarkPaidRequest {
    string id = 1;
}

message CertRevokeRequest {
    string id = 1;
}

message CertReassignRequest {
    string userId = 1;
    string certId = 2;
    string userDeviceId = 3;
}

message CertReapplyRequest {
    string userId = 1;
    string sourceCertId = 2;
    int32 durationMonths = 3;
    string description = 4;
}

message CertDismissReminderRequest {
    string userId = 1;
    string certId = 2;
}

message CertCalculatePriceRequest {
    string userDeviceId = 1;
    string expiresAt = 2;
}

message CertFindByIdRequest {
    string id = 1;
}

message CertFindByUserRequest {
    string userId = 1;
}

message CertFindByDealerRequest {
    string dealerId = 1;
    int32 page = 2;
    int32 limit = 3;
    string search = 4;
    string status = 5;
    string sort_by = 6;
    string sort_order = 7;
    string date_from = 8;
