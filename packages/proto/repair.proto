message RepairFindByIdRequest {
    string id = 1;
}

message RepairFindByUserRequest {
    string userId = 1;
    int32 page = 2;
    int32 limit = 3;
    string search = 4;
    string status = 5;
    string sort_by = 6;
    string sort_order = 7;
}

message RepairFindByRepairerRequest {
    string repairerUserId = 1;
    int32 page = 2;
    int32 limit = 3;
    string sort_by = 4;
    string sort_order = 5;
}

message RepairFindByRepairerFilteredRequest {
    string repairerUserId = 1;
    int32 page = 2;
    int32 limit = 3;
    string status = 4;
    string search = 5;
    string sort_by = 6;
    string sort_order = 7;
}

message RepairFindActiveByRepairerRequest {
    string repairerUserId = 1;
}

message RepairFindAllRequest {
    int32 page = 1;
    int32 limit = 2;
    string search = 3;
    string status = 4;
    string sort_by = 5;
    string sort_order = 6;
}

message RepairCheckActiveForDeviceRequest {
    string userDeviceId = 1;
}

message RepairSetConversationIdRequest {
    string requestId = 1;
