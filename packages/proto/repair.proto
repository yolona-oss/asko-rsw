// ═══════════════════════════════════════════════════════════════════════════
// Certificate Messages
// ═══════════════════════════════════════════════════════════════════════════

// ─── Certificate Records ───────────────────────────────────────────────────

message CertificateRecord {
    string id = 1;
    string userId = 2;
    string userDeviceId = 3;
    string dealerId = 4;
    string certificateNumber = 5;
    string status = 6;
    string issuedAt = 7;
    string expiresAt = 8;
    double price = 9;
    bool paid = 10;
    string purchaseReceiptUrl = 11;
    string description = 12;
    string createdAt = 13;
    UserDeviceRecord userDevice = 14;
    DealerProfileRecord dealer = 15;
    string signature = 16;
    string signedPayload = 17;
    string pdfDocumentId = 18;
}

// Frozen copy of a certificate's state at the moment a repair request was
// completed. Fields mirror CertificateRecord but only include what matters
// for historical display.
message CertificateSnapshotRecord {
    string id = 1;
    string certificateNumber = 2;
    string status = 3;
    string issuedAt = 4;
    string expiresAt = 5;
    string frozenAt = 6;
    string signedPayload = 7;
    string signature = 8;
}

