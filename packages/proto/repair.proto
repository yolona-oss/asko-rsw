}

message PaginatedDevicesResponse {
    repeated DeviceRecord data = 1;
    int32 overallCount = 2;
    int32 page = 3;
    int32 limit = 4;
}

message AddressRecord {
    string id = 1;
    string city = 2;
    string district = 3;
    string street = 4;
    string house = 5;
    string building = 6;
    string apartment = 7;
    string entrance = 8;
    string floor = 9;
    string intercom = 10;
    string comment = 11;
    double latitude = 12;
    double longitude = 13;
    string validationStatus = 14;
    string validationError = 15;
    bool isPrimary = 16;
}

message AddressResponse {
    AddressRecord address = 1;
}

message AddressListResponse {
    repeated AddressRecord addresses = 1;
}

message DevicePartRecord {
    string id = 1;
    string deviceId = 2;
    string name = 3;
    string partNumber = 4;
    double price = 5;
    string description = 6;
    string createdAt = 7;
    string updatedAt = 8;
    string deviceName = 9;
    string group = 10;
    string categoryId = 11;
    string categoryName = 12;
}

message DevicePartResponse {
