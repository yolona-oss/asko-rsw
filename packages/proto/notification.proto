syntax = "proto3";

package notification;

service NotificationService {
    rpc CreateNotification(CreateNotificationRequest) returns (NotificationResponse);
    rpc ListUserNotifications(ListUserNotificationsRequest) returns (PaginatedNotificationsResponse);
    rpc MarkAsRead(MarkAsReadRequest) returns (EmptyNotificationResponse);
    rpc MarkAllAsRead(MarkAllAsReadRequest) returns (EmptyNotificationResponse);
    rpc GetUnreadCount(GetUnreadCountRequest) returns (UnreadCountResponse);
    rpc DeleteNotification(DeleteNotificationRequest) returns (EmptyNotificationResponse);

    // Notification preferences
    rpc GetNotificationPreferences(GetPreferencesRequest) returns (NotificationPreferencesResponse);
    rpc UpdateNotificationPreferences(UpdatePreferencesRequest) returns (NotificationPreferencesResponse);

    // Push subscriptions
    rpc RegisterPushSubscription(RegisterPushSubscriptionRequest) returns (PushSubscriptionResponse);
    rpc UnregisterPushSubscription(UnregisterPushSubscriptionRequest) returns (EmptyNotificationResponse);
    rpc ListPushSubscriptions(ListPushSubscriptionsRequest) returns (PushSubscriptionListResponse);
}

// ─── Requests ───────────────────────────────────────────────────────────

message CreateNotificationRequest {
    string userId = 1;
    string type = 2;
    string title = 3;
    string body = 4;
    string targetType = 5;
    string targetId = 6;
    string metadata = 7;
    string urgency = 8;
}

message ListUserNotificationsRequest {
    string userId = 1;
    int32 page = 2;
    int32 limit = 3;
    bool unreadOnly = 4;
    string sort_by = 5;
    string sort_order = 6;
    string group = 7;
    string read_status = 8;
}

message MarkAsReadRequest {
    string notificationId = 1;
    string userId = 2;
}

message MarkAllAsReadRequest {
    string userId = 1;
}

message GetUnreadCountRequest {
    string userId = 1;
}

message DeleteNotificationRequest {
    string notificationId = 1;
    string userId = 2;
}

// ─── Responses ──────────────────────────────────────────────────────────

message EmptyNotificationResponse {}

message NotificationRecord {
    string id = 1;
    string userId = 2;
    string type = 3;
    string title = 4;
    string body = 5;
    string targetType = 6;
    string targetId = 7;
    string metadata = 8;
    bool isRead = 9;
    string readAt = 10;
    string createdAt = 11;
    string urgency = 12;
}

message NotificationResponse {
    NotificationRecord notification = 1;
}

message PaginatedNotificationsResponse {
    repeated NotificationRecord data = 1;
    int32 overallCount = 2;
    int32 page = 3;
    int32 limit = 4;
}

message UnreadCountResponse {
    int32 count = 1;
}

// ─── Preferences ───────────────────────────────────────────────────────

message GetPreferencesRequest {
    string userId = 1;
}

message GroupPreference {
    string group = 1;
    bool in_app = 2;
    bool push = 3;
    bool email = 4;
}

message NotificationPreferencesResponse {
    bool globalMute = 1;
    repeated GroupPreference groups = 2;
}

message UpdatePreferencesRequest {
    string userId = 1;
    bool globalMute = 2;
    repeated GroupPreference groups = 3;
    bool hasGlobalMute = 4;
}

// ─── Push Subscriptions ────────────────────────────────────────────────

message RegisterPushSubscriptionRequest {
    string userId = 1;
    string endpoint = 2;
    string p256dh = 3;
    string auth = 4;
    string userAgent = 5;
}

message PushSubscriptionResponse {
    string id = 1;
    string endpoint = 2;
    string createdAt = 3;
}

message UnregisterPushSubscriptionRequest {
    string userId = 1;
    string endpoint = 2;
}

message ListPushSubscriptionsRequest {
    string userId = 1;
}

message PushSubscriptionListResponse {
    repeated PushSubscriptionResponse subscriptions = 1;
}
