syntax = "proto3";

package content;

service ContentService {
    rpc CreateArticle (CreateArticleRequest) returns (ArticleResponse);
    rpc UpdateArticle (UpdateArticleRequest) returns (ArticleResponse);
    rpc DeleteArticle (DeleteArticleRequest) returns (EmptyContentResponse);
    rpc DeleteAllArticles (EmptyContentRequest) returns (DeleteCountResponse);
    rpc FindAllArticles (FindAllArticlesRequest) returns (PaginatedArticlesResponse);
    rpc FindArticleBySlug (FindArticleBySlugRequest) returns (ArticleResponse);
    rpc RecordView (RecordViewRequest) returns (EmptyContentResponse);
    rpc FindRelatedArticles (FindRelatedArticlesRequest) returns (ArticleListResponse);
    rpc FindRecommendedArticles (FindRecommendedArticlesRequest) returns (ArticleListResponse);
}

// ─── Record ────────────────────────────────────────────────────────────

message ArticleRecord {
    string id = 1;
    string title = 2;
    string slug = 3;
    string text = 4;
    string content = 5;    // JSON string of Lexical editor state
    repeated string tags = 6;
    int32 viewCount = 7;
    string createdAt = 8;
    string updatedAt = 9;
}

// ─── Requests ──────────────────────────────────────────────────────────

message CreateArticleRequest {
    string title = 1;
    string text = 2;
    string content = 3;    // JSON string
    repeated string tags = 4;
}

message UpdateArticleRequest {
    string id = 1;
    string title = 2;
    string text = 3;
    string content = 4;    // JSON string
    repeated string tags = 5;
}

message DeleteArticleRequest {
    string id = 1;
}

message FindAllArticlesRequest {
    int32 offset = 1;
    int32 limit = 2;
    string search = 3;
}

message FindArticleBySlugRequest {
    string slug = 1;
}

message RecordViewRequest {
    string slug = 1;
    string userId = 2;
    string sessionId = 3;
}

message FindRelatedArticlesRequest {
    string slug = 1;
    int32 limit = 2;
}

message FindRecommendedArticlesRequest {
    string userId = 1;
    int32 limit = 2;
}

message EmptyContentRequest {}
message EmptyContentResponse {}

// ─── Responses ─────────────────────────────────────────────────────────

message DeleteCountResponse {
    int32 count = 1;
}

message ArticleResponse {
    ArticleRecord article = 1;
}

message PaginatedArticlesResponse {
    repeated ArticleRecord data = 1;
    int32 overallCount = 2;
    int32 offset = 3;
    int32 limit = 4;
}

message ArticleListResponse {
    repeated ArticleRecord data = 1;
}
