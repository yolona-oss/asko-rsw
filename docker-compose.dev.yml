services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: asko-rabbitmq-dev
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_PLUGINS: "rabbitmq_management rabbitmq_prometheus"

  redis:
    image: redis:7-alpine
    container_name: asko-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: asko-redis-exporter-dev
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_ADDR: "redis://localhost:6379"
    command: ["--web.listen-address=:9121"]
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    container_name: asko-prometheus-dev
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.listen-address=:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: asko-grafana-dev
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_HTTP_PORT: 3001
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
