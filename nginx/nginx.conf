upstream auth_gateway      { server 127.0.0.1:4001; }
upstream repair_gateway    { server 127.0.0.1:4002; }
upstream media_gateway     { server 127.0.0.1:4003; }
upstream realtime_gateway  { server 127.0.0.1:4004; }
upstream content_gateway   { server 127.0.0.1:4005; }
upstream web_frontend      { server 127.0.0.1:3000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Auth gateway
    location /auth/   { proxy_pass http://auth_gateway; }
    location /invite/ { proxy_pass http://auth_gateway; }

    # Repair gateway
    location /repair-requests/   { proxy_pass http://repair_gateway; }
    location /devices/           { proxy_pass http://repair_gateway; }
    location /device-categories/ { proxy_pass http://repair_gateway; }
    location /certificates/      { proxy_pass http://repair_gateway; }
    location /repairers/         { proxy_pass http://repair_gateway; }
    location /dealers/           { proxy_pass http://repair_gateway; }
    location /reviews/           { proxy_pass http://repair_gateway; }
    location /schedule/          { proxy_pass http://repair_gateway; }
    location /address/           { proxy_pass http://repair_gateway; }
    location /payment/           { proxy_pass http://repair_gateway; }

    # Media gateway
    location /file-upload/ { proxy_pass http://media_gateway; }
    location /files/       { proxy_pass http://media_gateway; }
    location /images/      { proxy_pass http://media_gateway; }
    location /videos/      { proxy_pass http://media_gateway; }

    # Realtime gateway (WebSocket)
    location /chat/ {
        proxy_pass http://realtime_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /notifications/ {
        proxy_pass http://realtime_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /socket.io/ {
        proxy_pass http://realtime_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Content gateway
    location /articles/ { proxy_pass http://content_gateway; }
    location /users/    { proxy_pass http://content_gateway; }
    location /health    { proxy_pass http://content_gateway; }

    # Frontend
    location / { proxy_pass http://web_frontend; }
}
