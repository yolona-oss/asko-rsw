services:

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: asko-rabbitmq
    restart: unless-stopped
    network_mode: host
    environment:
      RABBITMQ_DEFAULT_USER: asko
      RABBITMQ_DEFAULT_PASS: asko_rmq_pass

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.notification-service
    container_name: asko-notification-service
    restart: unless-stopped
    network_mode: host
    depends_on:
      - rabbitmq
    environment:
      NODE_ENV: production
      GRPC_PORT: 5004
      RABBITMQ_URL: "amqp://asko:asko_rmq_pass@localhost:5672"

  repair-service:
    build:
      context: .
      dockerfile: Dockerfile.repair-service
    container_name: asko-repair-service
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      GRPC_PORT: 5003

  file-service:
    build:
      context: .
      dockerfile: Dockerfile.file-service
    container_name: asko-file-service
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      GRPC_PORT: 5002

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.payment-service
    container_name: asko-payment-service
    restart: unless-stopped
    network_mode: host
    depends_on:
      - rabbitmq
    environment:
      NODE_ENV: production
      GRPC_PORT: 5001
      RABBITMQ_URL: "amqp://asko:asko_rmq_pass@localhost:5672"

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user-service
    container_name: asko-user-service
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      GRPC_PORT: 5000

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: asko-api
    restart: unless-stopped
    network_mode: host
    depends_on:
      - user-service
      - payment-service
      - file-service
      - repair-service
      - notification-service
    environment:
      NODE_ENV: production
      USER_SERVICE_URL: "localhost:5000"
      PAYMENT_SERVICE_URL: "localhost:5001"
      FILE_SERVICE_URL: "localhost:5002"
      REPAIR_SERVICE_URL: "localhost:5003"
      NOTIFICATION_SERVICE_URL: "localhost:5004"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5


  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: asko-web
    restart: unless-stopped
    network_mode: host
    depends_on:
      - api
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
