services:

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: asko-rabbitmq
    restart: unless-stopped
    network_mode: host
    environment:
      RABBITMQ_DEFAULT_USER: asko
      RABBITMQ_DEFAULT_PASS: asko_rmq_pass
      RABBITMQ_PLUGINS: "rabbitmq_management rabbitmq_prometheus"

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: asko-redis-exporter
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_ADDR: "redis://localhost:6379"
    command: ["--web.listen-address=:9121"]

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile.chat-service
    container_name: asko-chat-service
    restart: unless-stopped
    network_mode: host
    depends_on:
      - rabbitmq
    environment:
      NODE_ENV: production
      GRPC_PORT: 5005
      METRICS_PORT: 9105
      RABBITMQ_URL: "amqp://asko:asko_rmq_pass@localhost:5672"

  content-service:
    build:
      context: .
      dockerfile: Dockerfile.content-service
    container_name: asko-content-service
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      GRPC_PORT: 5010
      METRICS_PORT: 9110

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.notification-service
    container_name: asko-notification-service
    restart: unless-stopped
    network_mode: host
    depends_on:
      - rabbitmq
    environment:
      NODE_ENV: production
      GRPC_PORT: 5004
      METRICS_PORT: 9104
      RABBITMQ_URL: "amqp://asko:asko_rmq_pass@localhost:5672"
      REDIS_URL: "redis://localhost:6379"
      # EMAIL_* loaded from notification-service .env.prod via ConfigModule

  repair-service:
    build:
      context: .
      dockerfile: Dockerfile.repair-service
    container_name: asko-repair-service
    restart: unless-stopped
    network_mode: host
    depends_on:
      - rabbitmq
    environment:
      NODE_ENV: production
      GRPC_PORT: 5003
      METRICS_PORT: 9103
      RABBITMQ_URL: "amqp://asko:asko_rmq_pass@localhost:5672"

  file-service:
    build:
      context: .
      dockerfile: Dockerfile.file-service
    container_name: asko-file-service
    restart: unless-stopped
    network_mode: host
    depends_on:
      - rabbitmq
    volumes:
      - images-data:/app/apps/file-service/images
    environment:
      NODE_ENV: production
      GRPC_PORT: 5002
      METRICS_PORT: 9102
      RABBITMQ_URL: "amqp://asko:asko_rmq_pass@localhost:5672"

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.payment-service
    container_name: asko-payment-service
    restart: unless-stopped
    network_mode: host
    depends_on:
      - rabbitmq
    environment:
      NODE_ENV: production
      GRPC_PORT: 5001
      METRICS_PORT: 9101
      RABBITMQ_URL: "amqp://asko:asko_rmq_pass@localhost:5672"

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user-service
    container_name: asko-user-service
    restart: unless-stopped
    network_mode: host
    depends_on:
      - rabbitmq
    environment:
      NODE_ENV: production
      GRPC_PORT: 5000
      METRICS_PORT: 9100
      RABBITMQ_URL: "amqp://asko:asko_rmq_pass@localhost:5672"

  auth-gateway:
    build:
      context: .
      dockerfile: Dockerfile.auth-gateway
    container_name: asko-auth-gateway
    restart: unless-stopped
    network_mode: host
    depends_on:
      - user-service
    environment:
      NODE_ENV: production
      PORT: 4001
      METRICS_PORT: 9120
      USER_SERVICE_URL: "localhost:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: asko-api
    restart: unless-stopped
    network_mode: host
    depends_on:
      - user-service
      - payment-service
      - file-service
      - repair-service
      - notification-service
      - chat-service
      - content-service
    volumes:
      - images-data:/app/apps/api/images
    environment:
      NODE_ENV: production
      USER_SERVICE_URL: "localhost:5000"
      PAYMENT_SERVICE_URL: "localhost:5001"
      FILE_SERVICE_URL: "localhost:5002"
      REPAIR_SERVICE_URL: "localhost:5003"
      NOTIFICATION_SERVICE_URL: "localhost:5004"
      CHAT_SERVICE_URL: "localhost:5005"
      CONTENT_SERVICE_URL: "localhost:5010"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5


  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: asko-web
    restart: unless-stopped
    network_mode: host
    depends_on:
      - api
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: asko-prometheus
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.listen-address=:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: asko-grafana
    restart: unless-stopped
    network_mode: host
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_HTTP_PORT: 3001
      GF_SERVER_ROOT_URL: "https://193.42.127.113/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

volumes:
  images-data:
  prometheus-data:
  grafana-data:
