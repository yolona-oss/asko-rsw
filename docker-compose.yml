services:

  device-service:
    build:
      context: .
      dockerfile: Dockerfile.device-service
    container_name: asko-device-service
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      GRPC_PORT: 5003

  certificate-service:
    build:
      context: .
      dockerfile: Dockerfile.certificate-service
    container_name: asko-certificate-service
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      GRPC_PORT: 5004

  repairer-service:
    build:
      context: .
      dockerfile: Dockerfile.repairer-service
    container_name: asko-repairer-service
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      GRPC_PORT: 5005

  repair-service:
    build:
      context: .
      dockerfile: Dockerfile.repair-service
    container_name: asko-repair-service
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      GRPC_PORT: 5006

  file-service:
    build:
      context: .
      dockerfile: Dockerfile.file-service
    container_name: asko-file-service
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      GRPC_PORT: 5002

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.payment-service
    container_name: asko-payment-service
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      GRPC_PORT: 5001

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user-service
    container_name: asko-user-service
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      GRPC_PORT: 5000

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: asko-api
    restart: unless-stopped
    network_mode: host
    depends_on:
      - user-service
      - payment-service
      - file-service
      - device-service
      - certificate-service
      - repairer-service
      - repair-service
    environment:
      NODE_ENV: production
      USER_SERVICE_URL: "localhost:5000"
      PAYMENT_SERVICE_URL: "localhost:5001"
      FILE_SERVICE_URL: "localhost:5002"
      DEVICE_SERVICE_URL: "localhost:5003"
      CERTIFICATE_SERVICE_URL: "localhost:5004"
      REPAIRER_SERVICE_URL: "localhost:5005"
      REPAIR_SERVICE_URL: "localhost:5006"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5


  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: asko-web
    restart: unless-stopped
    network_mode: host
    depends_on:
      - api
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
