groups:
  - name: service_health
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "{{ $labels.job }} ({{ $labels.instance }}) has been unreachable for more than 1 minute."

      - alert: HighHttpErrorRate
        expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) by (job) / sum(rate(http_requests_total[5m])) by (job) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on {{ $labels.job }}"
          description: "{{ $labels.job }} has >5% server error rate (current: {{ $value | humanizePercentage }})."

      - alert: HighHttpLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP p95 latency on {{ $labels.job }}"
          description: "{{ $labels.job }} p95 latency >2s (current: {{ $value | humanizeDuration }})."

      - alert: HighGrpcErrorRate
        expr: sum(rate(grpc_calls_total{status="error"}[5m])) by (job) / sum(rate(grpc_calls_total[5m])) by (job) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High gRPC error rate on {{ $labels.job }}"
          description: "{{ $labels.job }} has >5% gRPC error rate (current: {{ $value | humanizePercentage }})."

      - alert: HighGrpcLatency
        expr: histogram_quantile(0.95, sum(rate(grpc_call_duration_seconds_bucket[5m])) by (le, job)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High gRPC p95 latency on {{ $labels.job }}"
          description: "{{ $labels.job }} gRPC p95 latency >1s (current: {{ $value | humanizeDuration }})."

  - name: resource_usage
    rules:
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes > 1073741824
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.job }}"
          description: "{{ $labels.job }} RSS >1GB (current: {{ $value | humanize1024 }}B)."

      - alert: HighCpuUsage
        expr: rate(process_cpu_seconds_total[5m]) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.job }}"
          description: "{{ $labels.job }} CPU >90% (current: {{ $value | humanizePercentage }})."

      - alert: HighEventLoopLag
        expr: nodejs_eventloop_lag_seconds > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High event loop lag on {{ $labels.job }}"
          description: "{{ $labels.job }} event loop lag >500ms (current: {{ $value | humanizeDuration }})."

      - alert: HighFileDescriptors
        expr: process_open_fds / process_max_fds > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Running out of file descriptors on {{ $labels.job }}"
          description: "{{ $labels.job }} using >80% of max file descriptors."

      - alert: FrequentRestarts
        expr: changes(process_start_time_seconds[1h]) > 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Frequent restarts detected for {{ $labels.job }}"
          description: "{{ $labels.job }} restarted {{ $value }} times in the last hour."

  - name: rabbitmq
    rules:
      - alert: RabbitMQDown
        expr: up{job="rabbitmq"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ is down"
          description: "RabbitMQ has been unreachable for more than 1 minute."

      - alert: RabbitMQHighQueueDepth
        expr: rabbitmq_queue_messages > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High queue depth on {{ $labels.queue }}"
          description: "Queue {{ $labels.queue }} has {{ $value }} messages backed up."

      - alert: RabbitMQUnackedMessages
        expr: rabbitmq_queue_messages_unacked > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High unacked messages on {{ $labels.queue }}"
          description: "Queue {{ $labels.queue }} has {{ $value }} unacknowledged messages."

      - alert: RabbitMQNoConsumers
        expr: rabbitmq_queue_consumers == 0 and rabbitmq_queue_messages > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Queue {{ $labels.queue }} has no consumers"
          description: "Queue {{ $labels.queue }} has {{ $value }} messages but no consumers."

      - alert: RabbitMQHighMemory
        expr: rabbitmq_process_resident_memory_bytes > 1073741824
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ high memory usage"
          description: "RabbitMQ RSS >1GB (current: {{ $value | humanize1024 }}B)."

  - name: redis
    rules:
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis exporter has been unreachable for more than 1 minute."

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes > 536870912
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis high memory usage"
          description: "Redis using >512MB memory (current: {{ $value | humanize1024 }}B)."

      - alert: RedisHighConnectedClients
        expr: redis_connected_clients > 200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis has many connected clients"
          description: "Redis has {{ $value }} connected clients."

      - alert: RedisRejectedConnections
        expr: increase(redis_rejected_connections_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Redis is rejecting connections"
          description: "Redis rejected {{ $value }} connections in the last 5 minutes."

      - alert: RedisHighKeyEviction
        expr: increase(redis_evicted_keys_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis is evicting keys"
          description: "Redis evicted {{ $value }} keys in the last 5 minutes — memory pressure."

  - name: event_signing
    rules:
      # Any signature verify that failed for tamper / wrong-key reasons is
      # an immediate red flag: a compromised service or a forged publisher.
      - alert: EventSignatureTampering
        expr: sum(rate(event_signing_verify_total{outcome="signature_invalid"}[5m])) by (service, group) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Event signature verify failing on {{ $labels.service }} ({{ $labels.group }})"
          description: "HMAC signature mismatch on cross-service events — possible forgery or key drift. Investigate immediately."

      # Replayed nonces — only fires when a nonce store is configured.
      - alert: EventSignatureReplay
        expr: sum(rate(event_signing_verify_total{outcome="replay"}[10m])) by (service, group) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Replayed event detected on {{ $labels.service }} ({{ $labels.group }})"
          description: "A previously-seen nonce was re-delivered — possible replay attack or broker misconfiguration."

      # During soft-mode rollout, track how often we accept unsigned events.
      # This line should trend toward zero; when it flatlines at zero for
      # 24h, you can safely flip enforceOnConsume=true for that group.
      - alert: EventSignatureSoftModeStillBusy
        expr: sum(rate(event_signing_verify_total{outcome="unsigned_accepted"}[30m])) by (service, group) > 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.service }} still accepting unsigned events in group {{ $labels.group }}"
          description: "Some publisher hasn't migrated to SignedEventPublisher yet. Not dangerous, but blocks enforcement flip."

      # Enforce-mode rejections indicate a publisher is misconfigured.
      - alert: EventSignatureUnsignedRejected
        expr: sum(rate(event_signing_verify_total{outcome="unsigned_rejected"}[5m])) by (service, group) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} rejecting unsigned events in group {{ $labels.group }}"
          description: "An upstream publisher is sending unsigned events to an enforced group — either the publisher was reverted or a rogue service is attempting to publish."

  - name: authorization
    rules:
      # A sudden surge in denies usually means a misconfigured role or a
      # probe; an extreme ratio means the UI is broken.
      - alert: AccessDenySurge
        expr: |
          sum(rate(access_assert_total{outcome="deny"}[5m])) by (service, assertion)
            > 3 * sum(avg_over_time(rate(access_assert_total{outcome="deny"}[5m])[1h:5m])) by (service, assertion)
          and sum(rate(access_assert_total{outcome="deny"}[5m])) by (service, assertion) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Access deny surge on {{ $labels.service }} — {{ $labels.assertion }}"
          description: "Deny rate is >3× the 1-hour average for assertion {{ $labels.assertion }}. Investigate role changes, UI regressions, or probing."

      # Unexpected errors during assertions (downstream service unreachable, etc.)
      - alert: AccessAssertErrors
        expr: sum(rate(access_assert_total{outcome="error"}[5m])) by (service, assertion) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Access assertion errors on {{ $labels.service }} — {{ $labels.assertion }}"
          description: "Error rate >0.1/s while evaluating {{ $labels.assertion }}. Downstream service is flaky or returning unexpected shapes."

  - name: paid_payment_cache
    rules:
      # Integrity-check misses for paid certificates indicate the event
      # stream is stale or the cache wasn't backfilled on deploy.
      - alert: PaidPaymentCacheMissRate
        expr: |
          sum(rate(paid_payment_cache_lookup_total{result="miss"}[5m])) by (service)
            / (sum(rate(paid_payment_cache_lookup_total[5m])) by (service) > 0)
          > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PaidPayment cache miss rate high on {{ $labels.service }}"
          description: "More than 20% of cache lookups miss. Either payment-service events stopped flowing, or certs pre-date the cache — run the backfill."

      # Zero upsert activity over a long window = event consumer is wedged.
      - alert: PaidPaymentCacheStale
        expr: sum(increase(paid_payment_cache_upsert_total[1h])) by (service) == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No PaidPayment cache writes in the last hour on {{ $labels.service }}"
          description: "payment.paid events aren't being consumed — check RMQ connectivity or payment-service publisher."
