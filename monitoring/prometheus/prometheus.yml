global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "auth-gateway"
    static_configs:
      - targets: ["localhost:9120"]
    metrics_path: /metrics

  - job_name: "repair-gateway"
    static_configs:
      - targets: ["localhost:9121"]
    metrics_path: /metrics

  - job_name: "media-gateway"
    static_configs:
      - targets: ["localhost:9122"]
    metrics_path: /metrics

  - job_name: "realtime-gateway"
    static_configs:
      - targets: ["localhost:9123"]
    metrics_path: /metrics

  - job_name: "content-gateway"
    static_configs:
      - targets: ["localhost:9124"]
    metrics_path: /metrics

  - job_name: "user-service"
    static_configs:
      - targets: ["localhost:9100"]
    metrics_path: /metrics

  - job_name: "payment-service"
    static_configs:
      - targets: ["localhost:9101"]
    metrics_path: /metrics

  - job_name: "file-service"
    static_configs:
      - targets: ["localhost:9102"]
    metrics_path: /metrics

  - job_name: "repair-service"
    static_configs:
      - targets: ["localhost:9103"]
    metrics_path: /metrics

  - job_name: "notification-service"
    static_configs:
      - targets: ["localhost:9104"]
    metrics_path: /metrics

  - job_name: "chat-service"
    static_configs:
      - targets: ["localhost:9105"]
    metrics_path: /metrics

  - job_name: "content-service"
    static_configs:
      - targets: ["localhost:9110"]
    metrics_path: /metrics

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["localhost:15692"]
    metrics_path: /metrics

  - job_name: "redis"
    static_configs:
      - targets: ["localhost:9121"]
    metrics_path: /metrics
